name: mybinder-env
channels:
  - conda-forge
variables:
  PYVISTA_TRAME_SERVER_PROXY_PREFIX: ${JUPYTERHUB_SERVICE_PREFIX}/proxy/
dependencies:
  - esys-escript=5.10
  - python=3.11
  - pip
  - jupyter-server-proxy
  - trame-jupyter-extension
  - pyvista
  - trame
  - trame-vuetify
  - trame-vtk
  - ipywidgets
  - mesa-libgl-conda-x86_64
  - pip:
      - mammos-mumag==0.11.0
